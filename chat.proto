syntax = "proto3";

package chat;

service ChatService {
  rpc CreateRoom (RoomRequest) returns (RoomResponse);
  rpc CreateGroup (CreateGroupRequest) returns (RoomResponse);
  rpc LeaveRoom (LeaveRoomRequest) returns (LeaveRoomResponse);
  rpc SearchUsers (SearchUsersRequest) returns (SearchUsersResponse);
  rpc ListRooms (Empty) returns (RoomList);
  rpc SendMessage (MessageRequest) returns (MessageResponse);
  rpc GetMessages (HistoryRequest) returns (MessageList);
  rpc GetRoomMembers (RoomMembersRequest) returns (RoomMembersList);
  rpc UpdatePresence (PresenceRequest) returns (PresenceResponse);
}

message Empty {}

message RoomRequest {
  string room_name = 1;
  string username = 2;
}

message CreateGroupRequest {
  string group_name = 1;
  string creator_username = 2;
  repeated string participants = 3;
}

message RoomResponse {
  bool success = 1;
  string message = 2;
  int32 room_id = 3;
}

message LeaveRoomRequest {
  int32 room_id = 1;
  string username = 2;
}

message LeaveRoomResponse {
  bool success = 1;
  string message = 2;
  string new_admin = 3;
}

message SearchUsersRequest {
  string query = 1;
  string exclude_username = 2;
}

message UserSummary {
  int32 user_id = 1;
  string username = 2;
  bool is_active = 3;
}

message SearchUsersResponse {
  repeated UserSummary users = 1;
}

message RoomInfo {
  int32 room_id = 1;
  string room_name = 2;
}

message RoomList {
  repeated RoomInfo rooms = 1;
}

message MessageRequest {
  int32 room_id = 1;
  string username = 2;
  string content = 3;
}

message MessageResponse {
  bool success = 1;
  string message = 2;
  int32 message_id = 3;
  string timestamp = 4;
}

message HistoryRequest {
  int32 room_id = 1;
  int32 limit = 2;
  string username = 3;
}

message ChatMessage {
  int32 message_id = 1;
  int32 room_id = 2;
  string username = 3;
  string content = 4;
  string timestamp = 5;
}

message MessageList {
  repeated ChatMessage messages = 1;
}

message RoomMembersRequest {
  int32 room_id = 1;
  string username = 2;
}

message RoomMember {
  int32 user_id = 1;
  string username = 2;
  bool is_active = 3;
  string last_seen = 4;
  string role = 5;
}

message RoomMembersList {
  repeated RoomMember members = 1;
}

message PresenceRequest {
  string username = 1;
  bool is_online = 2;
}

message PresenceResponse {
  bool success = 1;
}