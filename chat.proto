syntax = "proto3";

package chat;

service ChatService {
  rpc CreateRoom (RoomRequest) returns (RoomResponse);
  rpc ListRooms (Empty) returns (RoomList);
  rpc SendMessage (MessageRequest) returns (MessageResponse);
  rpc GetMessages (HistoryRequest) returns (MessageList);
}

message Empty {}

message RoomRequest {
  string room_name = 1;
  string username = 2;
}

message RoomResponse {
  bool success = 1;
  string message = 2;
  int32 room_id = 3;
}

message RoomInfo {
  int32 room_id = 1;
  string room_name = 2;
}

message RoomList {
  repeated RoomInfo rooms = 1;
}

message MessageRequest {
  int32 room_id = 1;
  string username = 2;
  string content = 3;
}

message MessageResponse {
  bool success = 1;
  string message = 2;
  int32 message_id = 3;
  string timestamp = 4;
}

message HistoryRequest {
  int32 room_id = 1;
  int32 limit = 2;
}

message ChatMessage {
  int32 message_id = 1;
  int32 room_id = 2;
  string username = 3;
  string content = 4;
  string timestamp = 5;
}

message MessageList {
  repeated ChatMessage messages = 1;
}